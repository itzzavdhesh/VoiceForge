services:
  voiceforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: voiceforge:latest
    container_name: voiceforge-app
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MOCK_CHATTERBOX=true
      - CLIENT_URL=http://localhost:3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
